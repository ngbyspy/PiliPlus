<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiliPlus SPY · 发行版本</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--subtle:#f6f8fa;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--blue:#0969da;--green:#1a7f37;--button:#0969da;--shadow:0 1px 0 #1f23280a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit}button,a,input,summary{outline-offset:4px}button{cursor:pointer}header{border-bottom:1px solid var(--line);background:var(--subtle)}.top{max-width:1160px;margin:auto;padding:24px 32px 0}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:650;letter-spacing:-.4px}.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:#ff6699;color:#fff;font-weight:750;font-size:18px;letter-spacing:-1px}.local{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:0 9px;color:var(--muted);font-weight:400;letter-spacing:0}.topnav{display:flex;gap:28px;margin-top:24px;font-size:14px}.topnav span{border-bottom:2px solid #fd8c73;padding:0 4px 12px;font-weight:600}.topnav a{color:var(--muted);padding:0 4px 12px}.main{max-width:1160px;margin:auto;padding:32px;display:grid;grid-template-columns:168px minmax(0,1fr);gap:36px}aside{color:var(--muted)}aside h2{font-size:13px;color:var(--text);margin:0 0 14px;font-weight:600}.version-nav{display:grid;gap:4px}.version-nav a{display:block;font-size:13px;padding:7px 10px;border-radius:6px;overflow-wrap:anywhere}.version-nav a:first-child{background:var(--subtle);color:var(--text);font-weight:600}.aside-note{font-size:12px;margin-top:24px;line-height:1.8}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px}h1{font-size:24px;font-weight:600;letter-spacing:-.5px;margin:0}.lead{color:var(--muted);margin:0 0 24px}.search{display:flex;gap:10px;margin-bottom:24px;align-items:center;flex-wrap:wrap}.search input{min-width:180px;flex:1;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:6px;height:34px;padding:5px 12px}.filters{display:flex;gap:0}.filters button{border:1px solid var(--line);border-right:0;background:var(--subtle);color:var(--muted);height:34px;padding:4px 12px}.filters button:first-child{border-radius:6px 0 0 6px}.filters button:last-child{border-right:1px solid var(--line);border-radius:0 6px 6px 0}.filters button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}.release{border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);margin-bottom:24px;scroll-margin-top:24px}.release-head{padding:24px 24px 18px;border-bottom:1px solid var(--line)}.title-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.release h2{font-size:23px;line-height:1.4;letter-spacing:-.4px;margin:0;font-weight:600}.badge{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border:1px solid var(--green);border-radius:20px;color:var(--green);font-weight:500}.badge.old{border-color:var(--line);color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:8px}.release-body{padding:20px 24px 24px}.notes{margin:0 0 22px;padding-left:20px}.notes li{padding:2px 0}.assets-title{font-size:14px;font-weight:600;margin:0 0 12px;display:flex;gap:8px;align-items:center}.count{border-radius:20px;padding:0 7px;font-size:12px;background:var(--subtle);color:var(--muted)}.assets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.asset{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--subtle)}.asset-name{display:flex;align-items:center;gap:9px;font-weight:600}.asset-icon{width:20px;height:20px;display:inline-flex;color:var(--muted)}.asset-icon svg{width:20px;height:20px}.asset .desc{font-size:12px;color:var(--muted);margin:8px 0 14px;flex:1;line-height:1.7}.download,.pending{display:block;text-align:center;border-radius:6px;padding:7px 6px;font-size:13px;font-weight:500}.download{background:var(--button);color:white;border:1px solid #054da4}.download:hover{background:#075dc1;text-decoration:none}.pending{color:var(--muted);border:1px dashed var(--line);cursor:default}.size{font-size:11px;margin-top:7px;color:var(--muted);text-align:center}.technical{margin-top:20px;color:var(--muted);font-size:12px}.technical summary{cursor:pointer;user-select:none}.technical dl{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.technical dt{font-weight:600;color:var(--text);margin-top:12px}.technical dd{margin:4px 0 0}.technical code{display:block;overflow-wrap:anywhere;white-space:normal;font:11px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}.history{border:1px solid var(--line);border-radius:8px;margin-bottom:24px}.history>summary{cursor:pointer;padding:16px 20px;font-weight:500}.history[open]>summary{border-bottom:1px solid var(--line)}.history .release{border:0;box-shadow:none;margin:0}.history .release-head{border-bottom:0;padding-bottom:0}.empty{padding:36px;border:1px dashed var(--line);color:var(--muted);text-align:center;border-radius:8px}footer{border-top:1px solid var(--line);margin-top:32px;padding:18px 0;color:var(--muted);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}.hidden{display:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--subtle:#161b22;--text:#e6edf3;--muted:#9198a1;--line:#30363d;--blue:#58a6ff;--green:#3fb950;--button:#1f6feb;--shadow:none}.filters button[aria-pressed=true]{background:#1f6feb;border-color:#1f6feb}.download{border-color:#388bfd}.download:hover{background:#388bfd}}
@media(max-width:900px){.main{grid-template-columns:130px minmax(0,1fr);gap:24px}.assets{grid-template-columns:1fr}.asset{display:grid;grid-template-columns:1fr 180px;column-gap:20px}.asset .desc{grid-column:1;margin-bottom:0}.download,.pending{grid-column:2;grid-row:1/3;align-self:center}.size{grid-column:2;margin-top:0}}
@media(max-width:620px){.top{padding:20px 20px 0}.main{display:block;padding:24px 16px}.brand{font-size:18px}.topnav{gap:20px}aside{margin-bottom:24px}.version-nav{display:flex;gap:8px;flex-wrap:wrap}aside h2,.aside-note{display:none}.release-head{padding:20px}.release-body{padding:18px 20px 20px}.release h2{font-size:21px}.asset{display:flex}.asset .desc{margin:8px 0 12px}.size{margin-top:6px}.search input{flex-basis:100%}.filters{width:100%}.filters button{flex:1}.lead{font-size:13px}.history>summary{font-size:13px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span class="logo" aria-hidden="true">SP</span><span>PiliPlus <span style="font-weight:400">/</span> SPY</span><span class="local">本地发行库</span></div><nav class="topnav"><span>发行版本</span><a href="https://github.com/ngbyspy/PiliPlus/tree/spy/main" target="_blank" rel="noreferrer">源代码 ↗</a><a href="https://github.com/bggRGjQaUbCoE/PiliPlus/pull/3679" target="_blank" rel="noreferrer">上游 PR ↗</a></nav></div></header>
<main class="main"><aside><h2>版本</h2><nav class="version-nav" id="version-nav"></nav><p class="aside-note">安装包都保存在本机。<br>选择版本与平台，<br>直接获取对应文件。</p></aside><section><div class="heading"><h1>发行版本</h1></div><p class="lead">按版本获取 PiliPlus SPY。Windows 提供完整的 Portable ZIP，解压后即可运行。</p><div class="search"><input id="search" type="search" aria-label="搜索版本" placeholder="搜索版本或功能…"><div class="filters" aria-label="筛选平台"><button data-platform="all" aria-pressed="true">全部</button><button data-platform="Windows" aria-pressed="false">Windows</button><button data-platform="Android" aria-pressed="false">Android</button><button data-platform="iPad" aria-pressed="false">iPad</button></div></div><div id="releases"></div><footer><span>本地发行索引 · 无需联网</span><span>IPA 由用户自签；Linux 暂未提供。</span></footer></section></main>
<noscript><p style="padding:24px">请在启用 JavaScript 的浏览器中打开此本地发行页。</p></noscript>
<script>
const releases=__RELEASE_DATA__;
const icons={Windows:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h8v8H3zm10 0h8v8h-8zM3 14h8v8H3zm10 0h8v8h-8z"/></svg>',Android:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m7 4-2-2m12 2 2-2M5 9a7 7 0 0 1 14 0v10H5zM2 10v7m20-7v7M8 19v4m8-4v4"/><circle cx="9" cy="6" r=".6"/><circle cx="15" cy="6" r=".6"/></svg>',iPad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M10 19h4"/></svg>'};
const platformInfo={Windows:{title:'Windows x64',desc:'Portable ZIP · 完整解压后运行',button:'获取 Portable ZIP'},Android:{title:'Android ARM64',desc:'Android 7.0+ · 正式签名安装包',button:'获取 APK'},iPad:{title:'iPad / iPhone',desc:'iOS 15+ · 安装前需要自行签名',button:'获取 IPA'}};
let selected='all';
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function bytes(n){return(n/1048576).toFixed(1)+' MB'}
function platforms(r){return[...new Set([...r.assets.map(a=>a.platform),...(r.pendingPlatforms||[])])]}
releases.forEach((r,i)=>{r.id='version-'+i;const a=el('a','',r.version);a.href='#'+r.id;document.getElementById('version-nav').append(a)});
function assetCard(platform,asset,historical,status){const info=platformInfo[platform]||{title:platform,desc:'',button:'获取安装包'};const card=el('div','asset');const name=el('div','asset-name');const icon=el('span','asset-icon');icon.innerHTML=icons[platform]||'';icon.setAttribute('aria-hidden','true');name.append(icon,el('span','',info.title));card.append(name,el('div','desc',asset?historical?'历史测试包；不用于直接覆盖原版':info.desc:(status?.detail||info.desc)));if(asset){const a=el('a','download',info.button);a.href=asset.href;a.download=asset.name;card.append(a,el('div','size',bytes(asset.bytes)))}else card.append(el('span','pending',status?.label||'待补充'),el('div','size',status?'':'收到构建结果后追加'));return card}
function releaseCard(r,index){const article=el('article','release');article.id=r.id;const head=el('div','release-head');const title=el('div','title-row');title.append(el('h2','',r.title||r.version));if(!r.historical&&index===0)title.append(el('span','badge','最新'));if(r.historical)title.append(el('span','badge old','旧测试版'));head.append(title,el('div','meta',[r.date,r.upstreamVersion?'基于 '+r.upstreamVersion:r.version,r.relationship==='vertical'?'垂直改进':r.relationship==='parallel'?'平行功能版':''].filter(Boolean).join(' · ')));const body=el('div','release-body');if(r.highlights?.length){const list=el('ul','notes');r.highlights.forEach(note=>list.append(el('li','',note)));body.append(list)}const assetTitle=el('h3','assets-title','安装包');assetTitle.append(el('span','count',String(r.assets.length)));body.append(assetTitle);const grid=el('div','assets');for(const p of ['Windows','Android','iPad'])if((selected==='all'||selected===p)&&platforms(r).includes(p))grid.append(assetCard(p,r.assets.find(a=>a.platform===p),r.historical,r.platformStatus?.[p]));body.append(grid);const technical=el('details','technical');technical.append(el('summary','','校验值与构建信息'));const dl=el('dl');r.assets.forEach(a=>{dl.append(el('dt','',platformInfo[a.platform]?.title||a.platform));const dd=el('dd');dd.append(el('code','',a.name),el('code','','SHA-256  '+a.sha256));if(a.sourceCommit)dd.append(el('code','','源码提交  '+a.sourceCommit));dl.append(dd)});technical.append(dl);body.append(technical);article.append(head,body);if(r.historical){const d=el('details','history');d.append(el('summary','',r.title||r.version),article);return d}return article}
function render(){const root=document.getElementById('releases');root.replaceChildren();const query=document.getElementById('search').value.trim().toLowerCase();const found=releases.filter(r=>(selected==='all'||platforms(r).includes(selected))&&[r.title,r.version,...(r.highlights||[])].join(' ').toLowerCase().includes(query));found.forEach(r=>root.append(releaseCard(r,releases.indexOf(r))));if(!found.length)root.append(el('div','empty','没有找到匹配的版本。'))}
document.getElementById('search').addEventListener('input',render);document.querySelectorAll('[data-platform]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.platform;document.querySelectorAll('[data-platform]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));render()}));render();
</script>
</body>
</html>

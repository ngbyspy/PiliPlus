name: PiliPlus-SPY iPad IPA
run-name: ${{ github.ref_name == 'spy/dev' && 'iPad acceptance' || 'iPad release' }} · ${{ github.sha }}

on:
  push:
    branches: [spy/main, spy/dev]
    paths:
      - .github/workflows/spy-ipad.yml
      - lib/**
      - ios/**
      - test/watchroom/**
      - tool/spy/**
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:
    inputs:
      runner:
        description: Standard macOS 26 runner (device IPA remains ARM64)
        type: choice
        default: macos-26-intel
        options: [macos-26-intel, macos-26]

permissions:
  contents: read

concurrency:
  group: spy-ipad-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'ngbyspy/PiliPlus' &&
      (github.ref == 'refs/heads/spy/main' ||
       (github.ref == 'refs/heads/spy/dev' &&
        (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipad-acceptance]'))))
    runs-on: ${{ inputs.runner || 'macos-26-intel' }}
    timeout-minutes: 60
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: false
      - name: Check packaging verifier
        run: python3 -m unittest discover -s tool/spy/tests -p test_ios_package.py
      - name: Check native source preparation
        shell: pwsh
        run: ./tool/spy/tests/test_ios_source.ps1
      - name: Check compatible release version policy
        shell: pwsh
        run: ./tool/spy/tests/test_release_policy.ps1
      - name: Check isolated acceptance profiles
        shell: pwsh
        run: ./tool/spy/tests/test_acceptance_profiles.ps1
      - name: Validate and build device IPA
        shell: pwsh
        run: |
          ./tool/spy/build.ps1 -Platform iOS -SdkRoot $env:FLUTTER_ROOT `
            -AcceptanceBuild:($env:GITHUB_REF -eq 'refs/heads/spy/dev') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'PiliPlus-SPY-output')
      - uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-SPY-ipad-${{ github.ref_name == 'spy/dev' && 'acceptance-' || '' }}${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/PiliPlus-SPY-output/ipad/*.ipa
            ${{ runner.temp }}/PiliPlus-SPY-output/ipad/ipa-verification.json
            ${{ runner.temp }}/PiliPlus-SPY-output/build-ios.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: PiliPlus-SPY-ipad-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/PiliPlus-SPY-output/build-ios.json
